# kitty - arch only (mac uses wezterm, see .wezterm.lua)
# Reload in place after editing: ctrl+shift+f5

# JetBrainsMono Nerd Font ships real Bold/Italic/Bold-Italic faces, so `auto`
# picks them up instead of synthesising slanted/emboldened ones.
# `family=` syntax needs kitty >= 0.28. Use `kitty +list-fonts` for exact names.
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
