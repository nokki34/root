set -g mouse on

# Allow for all colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager.
# Every `set -g @plugin` must appear ABOVE this line. Machine overlays
# (files-<machine>/.tmux.conf.append) are concatenated below it, which is
# fine for key bindings - they simply win over any plugin defaults.
run '~/.tmux/plugins/tpm/tpm'

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
